name: ERP Quality Assurance, Security & Invariants Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  qa-and-security-gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pgsql, pdo_pgsql, mbstring, xml, ctype, json

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: SCA - PHP Dependency Vulnerability Audit (composer audit)
        run: composer audit --locked

      - name: Run migrations, seeder & 12 Business Invariants Audit (QA-02)
        run: |
          php artisan migrate:fresh --seed
          php artisan erp:audit-invariants

      - name: Run Automated QA, Invariant & Security Tests (S-01..S-18, QA-01)
        run: php artisan test

      - name: Install Frontend Dependencies & SCA (npm audit)
        run: |
          npm ci
          npm audit --audit-level=high || true

      - name: Build Frontend Assets
        run: npm run build
